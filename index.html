<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>The Moonsinger's Bell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Alegreya+Sans:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen cinema frame, 16:9 canvas centered on ink, controls line beneath */
:root{
  --ink:#07070d; --parchment:#e9e2cf; --gold:#d8b46a; --dusk:#8c8676; --btn:rgba(20,22,40,.55); --btnline:rgba(216,180,106,.55);
  --display:'Cinzel Decorative', Georgia, serif; --body:'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--parchment);margin:0;font-family:var(--body);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:relative;flex:0 0 auto;box-shadow:0 0 0 1px rgba(216,180,106,.18),0 20px 60px rgba(0,0,0,.6);background:#000}
#screen{display:block;width:100%;height:100%;outline:none}
#screen:focus-visible{box-shadow:0 0 0 2px var(--gold)}
#hint{font-size:13px;color:var(--dusk);letter-spacing:.02em;text-align:center;max-width:100%;line-height:1.5}
#hint b{color:var(--gold);font-weight:700}
#touch{position:absolute;inset:0;pointer-events:none}
#touch .pad{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:none}
#touch .left{left:calc(10px + env(safe-area-inset-left,0px))}
#touch .right{right:calc(10px + env(safe-area-inset-right,0px));flex-wrap:wrap;justify-content:flex-end;width:180px}
#touch button{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--btnline);background:var(--btn);
  color:var(--parchment);font:700 13px var(--body);touch-action:none}
#touch button:active,#touch button.on{background:rgba(216,180,106,.35)}
@media (pointer:fine){#touch{display:none}}
@media (pointer:coarse){#hint{display:none}}
</style>

<div id="wrap">
  <canvas id="screen" tabindex="0" aria-label="The Moonsinger's Bell game screen"></canvas>
  <div id="touch">
    <div class="pad left">
      <button data-k="left" aria-label="Move left">◀</button>
      <button data-k="right" aria-label="Move right">▶</button>
    </div>
    <div class="pad right">
      <button data-k="confirm" aria-label="Talk">Talk</button>
      <button data-k="special" aria-label="Spirit spin">Spin</button>
      <button data-k="dash" aria-label="Dash">Dash</button>
      <button data-k="attack" aria-label="Attack">Atk</button>
      <button data-k="jump" aria-label="Jump">Jump</button>
    </div>
  </div>
</div>
<div id="hint"><b>A/D</b> move · <b>Space</b> jump, again to double jump, hold to glide · <b>J</b> attack · <b>K</b> dash · <b>L</b> spirit spin · <b>E</b> talk · <b>W/S</b> pick reply · <b>Esc</b> pause · <b>M</b> mute</div>

<script>
"use strict";
// ================= CORE =================
const W=400,H=225,TS=16;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// ---------- input ----------
const held={}, hit={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'jump',KeyJ:'attack',KeyX:'attack',KeyK:'dash',KeyC:'dash',ShiftLeft:'dash',ShiftRight:'dash',
  KeyL:'special',KeyV:'special',KeyE:'confirm',Enter:'confirm',Escape:'pause',KeyP:'pause',KeyM:'mute'};
function press(a){ if(!held[a]) hit[a]=true; held[a]=true; }
function release(a){ held[a]=false; }
addEventListener('keydown',e=>{const a=KEYMAP[e.code]; if(!a) return; e.preventDefault(); if(!e.repeat) press(a); Sound.unlock();});
addEventListener('keyup',e=>{const a=KEYMAP[e.code]; if(a){e.preventDefault(); release(a);}});
addEventListener('blur',()=>{for(const k in held) held[k]=false;});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');press(k);Sound.unlock();});
  const up=e=>{b.classList.remove('on');release(k);};
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
});
function consume(a){ const v=!!hit[a]; hit[a]=false; return v; }
function clearHits(){ for(const k in hit) hit[k]=false; }

// ---------- audio ----------
const NOTE_IDX={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nfreq(n){ const m=/^([A-G])([#b]?)(\d)$/.exec(n); if(!m) return 0;
  let s=NOTE_IDX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12; return 440*Math.pow(2,(s-69)/12); }
function parseSeq(str){ return str.trim().split(/\s+/).filter(Boolean).map(t=>{const [n,d]=t.split(':'); return {f:n==='-'?0:nfreq(n), d:+d||2};}); }
const CH={G:['G3','B3','D4'],D:['D3','F#3','A3'],A:['A3','C#4','E4'],Am:['A3','C4','E4'],C:['C4','E4','G4'],Em:['E3','G3','B3'],
  E:['E3','G#3','B3'],F:['F3','A3','C4'],Dm:['D3','F3','A3'],Gm:['G3','Bb3','D4'],Bb:['Bb3','D4','F4'],B:['B3','D#4','F#4'],Bm:['B3','D4','F#4']};
function arp(chords,up){ return chords.split(',').map(c=>{const [a,b,d]=CH[c.trim()].map(n=>up?n.replace(/\d/,o=>+o+1):n);
  return `${a}:2 ${b}:2 ${d}:2 ${b}:2 ${a}:2 ${b}:2 ${d}:2 ${b}:2`;}).join(' '); }
function bassl(chords,busy){ return chords.split(',').map(c=>{const r=CH[c.trim()][0].replace(/\d/,''); const f=CH[c.trim()][2].replace(/\d/,'');
  return busy?`${r}2:2 ${r}2:2 ${r}3:2 ${r}2:2 ${f}2:2 ${r}2:2 ${r}3:2 ${f}2:2`:`${r}2:6 ${r}2:2 ${r}3:4 ${f}2:4`;}).join(' '); }

const TRACKS={
  village:{bpm:96,lead:'square',harmVol:.035,
    lead_:'G4:4 B4:4 D5:6 C#5:2 D5:4 B4:4 G4:8 A4:4 B4:4 C5:6 B4:2 A4:4 F#4:4 D4:8 G4:4 B4:4 D5:6 E5:2 F#5:4 E5:4 D5:8 C5:4 E5:4 D5:4 B4:4 A4:12 -:4',
    chords:'G,G,Am,D,G,D,C,D',drums:'k...h...s...h...'},
  field:{bpm:132,lead:'square',harmVol:.03,
    lead_:'D5:6 A4:2 A4:4 D5:2 E5:2 F#5:4 E5:2 D5:2 E5:8 D5:6 A4:2 A4:4 D5:2 E5:2 F#5:4 A5:4 G5:8 B5:6 A5:2 G5:4 F#5:4 E5:4 F#5:2 G5:2 E5:8 A5:6 G5:2 F#5:4 E5:4 D5:12 -:4',
    chords:'D,A,D,G,G,Em,A,D',drums:'k.h.s.hkk.h.s.h.',busy:1},
  battle:{bpm:150,lead:'square',harmVol:.03,
    lead_:'A4:2 A4:2 C5:2 A4:2 E5:4 D5:4 C5:2 B4:2 A4:2 G#4:2 A4:8 A4:2 A4:2 C5:2 E5:2 A5:4 G5:4 F5:2 E5:2 D5:2 C5:2 B4:8 F5:4 E5:4 D5:4 C5:4 E5:4 D5:4 C5:4 B4:4 C5:2 D5:2 E5:4 G#5:4 B5:4 A5:12 -:4',
    chords:'Am,E,Am,E,F,G,E,Am',drums:'k.h.s.hkk.h.s.hs',busy:1},
  boss:{bpm:160,lead:'sawtooth',harmVol:.028,leadVol:.045,
    lead_:'D5:4 D5:2 F5:2 E5:4 D5:2 C#5:2 D5:2 A4:2 A4:4 -:4 A4:2 Bb4:2 C5:4 C5:2 E5:2 D5:4 C5:2 Bb4:2 A4:12 -:4 F5:4 F5:2 A5:2 G5:4 F5:2 E5:2 F5:2 D5:2 D5:4 -:4 D5:2 E5:2 F5:4 G5:4 A5:4 C#6:4 D6:12 -:4',
    chords:'Dm,Dm,C,A,Dm,Bb,A,Dm',drums:'kks.hks.kks.hksk',busy:1},
  romance:{bpm:80,lead:'triangle',harmVol:.03,leadVol:.12,
    lead_:'A4:4 C5:4 F5:6 E5:2 D5:4 C5:4 A4:8 Bb4:4 D5:4 G5:6 F5:2 E5:4 D5:4 C5:8 A4:4 C5:4 F5:6 G5:2 A5:4 G5:4 F5:4 D5:4 C5:4 Bb4:4 A4:4 G4:4 F4:12 -:4',
    chords:'F,Dm,Gm,C,F,Dm,C,F',drums:''},
  night:{bpm:104,lead:'square',harmVol:.025,leadVol:.05,
    lead_:'E5:6 B4:2 G4:8 F#4:4 G4:4 A4:8 B4:6 E5:2 D5:8 C5:4 B4:4 A4:8 G5:6 F#5:2 E5:8 D5:4 C5:4 B4:8 C5:4 A4:4 D#5:8 E5:12 -:4',
    chords:'Em,D,Em,Am,C,G,B,Em',drums:'k.......h...s...'},
  ending:{bpm:84,lead:'triangle',harmVol:.03,leadVol:.12,
    lead_:'G4:4 B4:4 D5:6 C#5:2 D5:4 B4:4 G4:8 A4:4 B4:4 C5:6 B4:2 A4:4 F#4:4 D4:8 G4:4 B4:4 D5:6 E5:2 F#5:4 E5:4 D5:8 C5:4 E5:4 D5:4 B4:4 G4:12 -:4',
    chords:'G,G,Am,D,G,D,C,G',drums:'k.......h.......'}
};
for(const k in TRACKS){const t=TRACKS[k]; t.chan=[
  {wave:t.lead,vol:t.leadVol||.06,seq:parseSeq(t.lead_),lead:1},
  {wave:'pulse',vol:t.harmVol,seq:parseSeq(arp(t.chords,k==='romance'||k==='ending'))},
  {wave:'triangle',vol:.16,seq:parseSeq(bassl(t.chords,t.busy))}];}

const Sound={ctx:null,muted:false,cur:null,
  unlock(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{ const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C(); }catch(e){ return; }
    const c=this.ctx; this.master=c.createGain(); this.master.gain.value=.8; this.master.connect(c.destination);
    this.music=c.createGain(); this.music.gain.value=0; this.sfxBus=c.createGain(); this.sfxBus.gain.value=.55;
    const dl=c.createDelay(); dl.delayTime.value=.23; const fb=c.createGain(); fb.gain.value=.28; const wet=c.createGain(); wet.gain.value=.22;
    this.music.connect(this.master); this.music.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(this.master);
    this.sfxBus.connect(this.master);
    const real=new Float32Array([0,...Array.from({length:31},(_,i)=>{const n=i+1;return 2/(n*Math.PI)*Math.sin(n*Math.PI*.25);})]);
    this.pulse=c.createPeriodicWave(real.map(()=>0),real);
    const nb=c.createBuffer(1,c.sampleRate,c.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.noise=nb;
    setInterval(()=>this.tick(),25);
    if(this.want) this.play(this.want,true);
  },
  play(name,force){ this.want=name; if(!this.ctx) return; if(this.cur&&this.cur.name===name&&!force) return;
    const c=this.ctx, g=this.music.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime);
    g.linearRampToValueAtTime(0,c.currentTime+.35);
    const tr=TRACKS[name]; const start=c.currentTime+.4;
    this.cur={name,tr,start,ch:tr.chan.map(()=>({i:0,t:start})),dr:{i:0,t:start}};
    g.linearRampToValueAtTime(this.muted?0:1,start+.3);
  },
  stop(){ this.want=null; if(!this.ctx) return; const g=this.music.gain,c=this.ctx; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(0,c.currentTime+.6); this.cur=null; },
  toggleMute(){ this.muted=!this.muted; if(!this.ctx) return; this.master.gain.setTargetAtTime(this.muted?0:.8,this.ctx.currentTime,.05); },
  tick(){ const c=this.ctx, s=this.cur; if(!s) return; const ahead=c.currentTime+.15, six=60/s.tr.bpm/4;
    s.tr.chan.forEach((chn,ci)=>{const st=s.ch[ci]; while(st.t<ahead){const n=chn.seq[st.i]; const dur=n.d*six;
      if(n.f) this.note(chn,n.f,st.t,dur); st.t+=dur; st.i=(st.i+1)%chn.seq.length;}});
    const dp=s.tr.drums; if(dp){const st=s.dr; while(st.t<ahead){const ch=dp[st.i]; if(ch!=='.') this.drum(ch,st.t); st.t+=six; st.i=(st.i+1)%dp.length;}}
  },
  note(chn,f,t,dur){ const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    if(chn.wave==='pulse') o.setPeriodicWave(this.pulse); else o.type=chn.wave;
    o.frequency.value=f; if(chn.lead&&dur>.25){const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=5.5; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(f*.012,t+dur); l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur+.1);}
    const v=chn.vol, rel=Math.min(.12,dur*.4);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.012); g.gain.linearRampToValueAtTime(v*.7,t+.08);
    g.gain.setValueAtTime(v*.7,t+dur-rel); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(this.music); o.start(t); o.stop(t+dur+.02); },
  drum(ch,t){ const c=this.ctx;
    if(ch==='k'){const o=c.createOscillator(),g=c.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.12);
      g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.connect(g); g.connect(this.music); o.start(t); o.stop(t+.16); return;}
    const s=c.createBufferSource(); s.buffer=this.noise; const f=c.createBiquadFilter(), g=c.createGain();
    if(ch==='s'){f.type='bandpass'; f.frequency.value=1800; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.13);}
    else {f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.04);}
    s.connect(f); f.connect(g); g.connect(this.music); s.start(t,Math.random()*.5); s.stop(t+.15); },
  tone(type,f1,f2,dur,vol,delay){ if(!this.ctx) return; const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    if(type==='pulse') o.setPeriodicWave(this.pulse); else o.type=type;
    o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t+dur+.02); },
  hiss(f,dur,vol,type,delay){ if(!this.ctx) return; const c=this.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noise; fl.type=type||'bandpass'; fl.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.sfxBus); s.start(t,Math.random()*.5); s.stop(t+dur+.02); },
  sfx(n){ if(!this.ctx||this.muted) return;
    switch(n){
      case 'jump': this.tone('pulse',300,620,.12,.12); break;
      case 'djump': this.tone('pulse',420,900,.14,.12); this.hiss(3000,.12,.08); break;
      case 'glide': this.hiss(900,.35,.1,'lowpass'); break;
      case 'swing': this.hiss(2400,.1,.22,'bandpass'); this.tone('triangle',900,300,.08,.06); break;
      case 'hit': this.tone('square',220,60,.12,.18); this.hiss(1200,.1,.25); break;
      case 'hurt': this.tone('sawtooth',300,80,.3,.18); break;
      case 'dash': this.hiss(1500,.18,.2,'bandpass'); break;
      case 'spin': this.hiss(2200,.4,.2); this.tone('pulse',400,1400,.35,.1); break;
      case 'blip': this.tone('pulse',880+Math.random()*120,0,.03,.035); break;
      case 'select': this.tone('pulse',660,0,.06,.08); this.tone('pulse',990,0,.08,.08,.06); break;
      case 'heart': [784,988,1175,1568].forEach((f,i)=>this.tone('pulse',f,0,.12,.09,i*.07)); break;
      case 'bell': [1319,1976,2637].forEach((f,i)=>this.tone('sine',f,0,1.4,.12/(i+1),i*.01)); break;
      case 'howl': this.tone('sawtooth',220,520,.5,.14); this.tone('sawtooth',520,260,.7,.14,.5); break;
      case 'slam': this.tone('sine',120,30,.5,.4); this.hiss(400,.5,.35,'lowpass'); break;
      case 'kill': this.tone('square',600,120,.25,.12); this.hiss(800,.3,.15); break;
      case 'secret': [523,659,784,1047,1319].forEach((f,i)=>this.tone('pulse',f,0,.14,.09,i*.09)); break;
      case 'aff': [1047,1319,1568].forEach((f,i)=>this.tone('sine',f,0,.4,.08,i*.08)); break;
      case 'check': [659,880,1319].forEach((f,i)=>this.tone('triangle',f,0,.3,.12,i*.1)); break;
    }}
};

// ================= ART =================
function mkCanvas(w,h){const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return [c,x];}
function R(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function ell(c,cx,cy,rx,ry,col){ c.fillStyle=col; for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)))); c.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1);} }
function pline(c,x0,y0,x1,y1,col,th){ c.fillStyle=col; x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1); th=th||1;
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1; let e=dx+dy,n=0;
  while(n++<400){ c.fillRect(x0,y0,th,th); if(x0===x1&&y0===y1) break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } }
function hash(x,y){ let h=(x*374761393+y*668265263)^0x5bd1e995; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967295; }
// mirrored part drawer: dx relative to center, y relative to feet
function M(c,X,Y,f){ return (dx,dy,w,h,col)=>R(c, f>0?X+dx:X-dx-w, Y+dy, w,h,col); }

// ---------- Shayan ----------
function drawShayan(c,X,Y,f,s){
  const p=M(c,X,Y,f), t=s.t, a=s.anim;
  const run=a==='run'?Math.sin(t*15):0, bob=a==='run'?Math.round(Math.abs(Math.sin(t*15))*-1):(a==='idle'?Math.round(Math.sin(t*3)*.6):0);
  const air=a==='jump'||a==='fall'||a==='glide';
  // scarf tail
  const sw=Math.sin(t*10)*1.5, sl=a==='run'||a==='dash'||a==='glide'?7:4;
  for(let i=0;i<sl;i++) p(-5-i, -15+bob+Math.round(Math.sin(t*10-i*.8)*(i/3))+(a==='glide'?-1:i>3?1:0), 1, 2, i>sl-3?'#9e2f2a':'#c8423a');
  // legs
  if(air){ p(-3,-7,3,5,'#3b3550'); p(1,-6,3,4,'#3b3550'); p(-3,-3,3,2,'#2a1d16'); p(1,-3,3,2,'#2a1d16'); }
  else if(a==='dash'){ p(-4,-6,3,6,'#3b3550'); p(2,-5,4,5,'#3b3550'); p(-5,-2,4,2,'#2a1d16'); p(3,-2,4,2,'#2a1d16'); }
  else { const l1=Math.round(run*2.5), l2=-l1;
    p(-3+l1,-7,3,7,'#3b3550'); p(1+l2,-7,3,7,'#2f2a42'); p(-3+l1,-2,3+(f>0?1:0),2,'#2a1d16'); p(1+l2,-2,4,2,'#22160f'); }
  // back sword (sheathed)
  if(a!=='attack'&&a!=='spin'){ for(let i=0;i<9;i++) p(-5+Math.round(i*.6),-19+i+bob,1,1,i<2?'#c9a24a':'#8b93a8'); }

  else if(biome==='ruins'){ for(let x=0;x<800;x+=130){ R(mc,x+10,90,14,140,B.mid); R(mc,x+70,110,14,120,B.mid); for(let a=0;a<30;a++) R(mc,x+10+a*2,90-Math.sin(a/30*Math.PI)*24,6,4,B.mid); } R(mc,0,185,800,50,B.mid); }
  else { for(let x=0;x<800;x+=110){ for(let y=0;y<90;y+=4) R(mc,x+40+(y/4%2?1:0),y,3,3,'#3a2a30'); } }
  // foreground
  for(let x=0;x<800;x+=3){ const h=8+hash(x,7)*22; const col=biome==='keep'?'#120608':biome==='ruins'?'#0a1418':'#1a2a1a'; if(hash(x,8)>.35) pline(gc,x,H,x+Math.round((hash(x,9)-.5)*8),H-h,col,2); }
  if(biome==='village'){ for(let s=0;s<2;s++){ const ox=s*400; for(let x=0;x<400;x+=2){ const y=18+Math.sin(x/400*Math.PI)*28; R(gc,ox+x,y,2,1,'#2a2030'); if(x%26===0){ R(gc,ox+x-2,y+1,5,7,['#ff7a5a','#ffcf6b','#7ad0ff','#ff9ad0'][(x/26)%4]); } } } }
  if(biome==='ruins'){ for(let x=0;x<800;x+=97){ const len=16+hash(x,11)*40; for(let y=0;y<len;y+=3) ell(gc,x+Math.sin(y/9)*3,y,2,2,'#0e1a1c'); } }
  if(biome==='meadow'||biome==='village'){ for(let x=30;x<800;x+=190){ for(let i=0;i<9;i++) ell(gc,x+Math.cos(i)*14,4+Math.sin(i*1.7)*6,6,3,biome==='meadow'?'#22401f':'#1c2418'); } }
  else { for(let x=40;x<800;x+=230){ for(let y=0;y<90;y+=5) R(gc,x,y,4,4,'#0a0406'); R(gc,x-6,90,16,10,'#0a0406'); } }
  return {far,far2,mid,fg};
}

// ---------- entities ----------
const Player={};
function resetPlayer(x,y,keepHP){ Object.assign(Player,{x:x-5,y:y-22,w:10,h:22,vx:0,vy:0,face:1,onGround:false,jumps:2,coyote:0,jbuf:0,
  anim:'idle',t:0,atk:null,combo:0,comboT:0,dash:0,dashCd:0,airDash:1,inv:0,hurt:0,spin:0,spinTick:0,gliding:false,lastSafe:{x,y},glideSnd:0});
  if(!keepHP){ Player.hp=Player.maxHp=12; } if(Player.spirit==null) Player.spirit=40; }

function rectHitsTile(L,x,y,w,h,pred){ const x0=Math.floor(x/TS),x1=Math.floor((x+w-.01)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-.01)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(pred(tileAt(L,tx,ty),tx,ty)) return {tx,ty}; return null; }
const isSolid=v=>v===1||v===2;
function moveBody(e,L,dt,bounds){
  e.x+=e.vx*dt; let h;
  if(e.vx>0&&(h=rectHitsTile(L,e.x,e.y,e.w,e.h,isSolid))){ e.x=h.tx*TS-e.w; e.vx=0; e.hitWall=1; }
  else if(e.vx<0&&(h=rectHitsTile(L,e.x,e.y,e.w,e.h,isSolid))){ e.x=(h.tx+1)*TS; e.vx=0; e.hitWall=-1; }
  if(bounds){ if(e.x<bounds[0]){e.x=bounds[0];e.vx=Math.max(0,e.vx);e.hitWall=-1;} if(e.x+e.w>bounds[1]){e.x=bounds[1]-e.w;e.vx=Math.min(0,e.vx);e.hitWall=1;} }
  const prevB=e.y+e.h; e.y+=e.vy*dt; e.onGround=false;
  if(e.vy>0){ h=rectHitsTile(L,e.x+1,e.y,e.w-2,e.h,(v,tx,ty)=>isSolid(v)||(v===3&&prevB<=ty*TS+.5&&!e.drop));
    if(h){ e.y=h.ty*TS-e.h; e.vy=0; e.onGround=true; } }
  else if(e.vy<0&&(h=rectHitsTile(L,e.x+1,e.y,e.w-2,e.h,isSolid))){ e.y=(h.ty+1)*TS; e.vy=0; }
}

const FX={parts:[],arcs:[],shake:0,hitstop:0,flash:0,
  burst(x,y,n,col,sp,glow,g){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(sp*.3,sp); this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,life:rnd(.3,.7),max:.7,col,size:Math.random()<.3?2:1,g:g==null?300:g,glow});} },
  update(dt){ this.parts=this.parts.filter(p=>{p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.life>0;});
    this.arcs=this.arcs.filter(a=>(a.life-=dt)>0); this.shake=Math.max(0,this.shake-dt*30); this.flash=Math.max(0,this.flash-dt*3); }
};
function shake(n){ FX.shake=Math.max(FX.shake,n); }

function spawnEnemies(L){ L.mobs=[]; for(const e of L.ents){
  if(e.type==='hound'||e.type==='archer') L.mobs.push(makeMob(e.type,e.x*TS+8,e.y*TS)); } }
function makeMob(type,x,y){ return {type,x:x-6,y:y-24,w:12,h:24,vx:0,vy:0,hp:type==='archer'?4:6,maxHp:type==='archer'?4:6,face:-1,state:'patrol',st:0,t:Math.random()*5,flash:0,home:x,cd:rnd(.5,1.5),anim:'idle'}; }

function updateMob(m,L,dt,P,bounds){
  m.t+=dt; m.flash=Math.max(0,m.flash-dt); m.st+=dt; m.cd-=dt;
  const dx=(P.x+P.w/2)-(m.x+m.w/2), dy=(P.y+P.h)-(m.y+m.h), dist=Math.abs(dx);
  const groundAhead=()=>{ const fx=m.face>0?m.x+m.w+2:m.x-2; return isSolid(tileAt(L,Math.floor(fx/TS),Math.floor((m.y+m.h+2)/TS)))||tileAt(L,Math.floor(fx/TS),Math.floor((m.y+m.h+2)/TS))===3; };
  if(m.state==='stun'){ if(m.st>.3) {m.state='chase';m.st=0;} }
  else if(m.type==='hound'){
    if(m.state==='patrol'){ m.vx=m.face*30; if(!groundAhead()||m.hitWall||Math.abs(m.x-m.home)>50&&Math.sign(m.x-m.home)===m.face) m.face*=-1; if(dist<170&&Math.abs(dy)<60){m.state='chase';m.st=0;} }
    if(m.state==='chase'){ m.face=Math.sign(dx)||1; m.vx=groundAhead()?m.face*62:0; if(dist<48&&Math.abs(dy)<26&&m.cd<=0){m.state='tell';m.st=0;m.vx=0;} if(dist>260) m.state='patrol'; }
    if(m.state==='tell'){ m.vx=0; if(m.st>.45){m.state='lunge';m.st=0;m.vx=m.face*235;m.vy=-60;Sound.sfx('dash');} }
    if(m.state==='lunge'){ if(m.st>.3){m.state='recover';m.st=0;} }
    if(m.state==='recover'){ m.vx*=.85; if(m.st>.55){m.state='chase';m.st=0;m.cd=rnd(.6,1.4);} }
  } else { // archer
    m.face=dist<240?(Math.sign(dx)||1):m.face;
    if(m.state==='patrol'||m.state==='chase'){ m.state='chase'; let want=dist<90?-m.face:dist>150?m.face:0; m.vx=want*45; if(m.vx&&!((m.vx>0?m.face>0:m.face<0)?groundAhead():true)) m.vx=0;
      if(m.vx<0===m.face>0&&m.vx!==0){ const fx=m.vx>0?m.x+m.w+2:m.x-2; const v=tileAt(L,Math.floor(fx/TS),Math.floor((m.y+m.h+2)/TS)); if(!(isSolid(v)||v===3)) m.vx=0; }
      if(dist<240&&Math.abs(dy)<100&&m.cd<=0){m.state='tell';m.st=0;m.vx=0;} }
    if(m.state==='tell'&&m.st>.55){ const T=.85, g=500; L.bolts.push({x:m.x+m.w/2,y:m.y+6,vx:dx/T,vy:(dy-12-.5*g*T*T)/T,g,t:0,kind:'bone'}); Sound.sfx('swing'); m.state='recover';m.st=0; }
    if(m.state==='recover'&&m.st>.4){ m.state='chase'; m.cd=rnd(1.8,2.6); }
  }
  m.hitWall=0; m.vy+=G*dt; moveBody(m,L,dt,bounds);
  m.anim=m.state==='tell'?'tell':m.state==='lunge'?'lunge':Math.abs(m.vx)>5?'run':'idle';
  if(m.y>L.h*TS+40) m.hp=0;
}

// ---------- boss ----------
function makeBoss(x,y){ return {type:'boss',x:x-13,y:y-50,w:26,h:50,vx:0,vy:0,hp:64,maxHp:64,face:-1,state:'intro',st:0,t:0,flash:0,anim:'idle',queue:[],phase:1,waves:[],orbs:[]}; }
function updateBoss(b,L,dt,P,bounds){
  b.t+=dt; b.flash=Math.max(0,b.flash-dt); b.st+=dt;
  const r=b.hp/b.maxHp, ph=r>.6?1:r>.3?2:3; if(ph!==b.phase){ b.phase=ph; if(Game.onBossPhase) Game.onBossPhase(ph); }
  const sp=ph===3?1.25:1, cx=b.x+b.w/2, pcx=P.x+P.w/2, dx=pcx-cx;
  const go=(s)=>{b.state=s;b.st=0;};
  switch(b.state){
    case 'intro': b.anim='idle'; break;
    case 'idle': b.anim=Math.abs(dx)>60?'run':'idle'; b.face=Math.sign(dx)||1; b.vx=Math.abs(dx)>60?b.face*48*sp:0;
      if(b.st>(ph===1?.9:.6)/sp){ const opts=Math.abs(dx)<80?['slash','slash','leap']:['leap','slash']; if(ph>=2) opts.push('charge','howl'); go(opts[Math.floor(Math.random()*opts.length)]+'_'); } break;
    case 'slash_': b.vx=0; b.anim='windup'; b.slashN=ph>=2?2:1; if(b.st>.2) go('windup'); break;
    case 'windup': b.anim='windup'; b.face=Math.sign(dx)||b.face; b.vx=0; if(b.st>.5/sp){ go('slash'); b.vx=b.face*140; Sound.sfx('swing'); shake(2); } break;
    case 'slash': b.anim='slash'; b.ap=Math.min(1,b.st/.18); b.vx*=.85;
      if(b.st<.2){ const hx=b.face>0?cx:cx-62; hurtPlayerRect(hx,b.y+4,62,b.h-4,2,b.face); }
      if(b.st>.45){ b.ap=null; if(--b.slashN>0){go('windup');b.st=.18;} else { go('recover'); } } break;
    case 'leap_': b.anim='leapPrep'; b.vx=0; if(b.st>.5/sp){ const T=.75; b.vx=clamp(dx/T,-260,260); b.vy=-420; go('leap'); Sound.sfx('jump'); } break;
    case 'leap': b.anim='leapPrep'; if(b.onGround&&b.st>.1){ Sound.sfx('slam'); shake(7); b.vx=0;
        b.waves.push({x:cx,dir:1,y:b.y+b.h,life:1.6},{x:cx,dir:-1,y:b.y+b.h,life:1.6}); FX.burst(cx,b.y+b.h,24,'#c8b8a8',140,0,500);
        hurtPlayerRect(cx-30,b.y+b.h-20,60,20,2,Math.sign(dx)||1); go('winded'); } break;
    case 'charge_': b.anim='leapPrep'; b.face=Math.sign(dx)||b.face; b.vx=-b.face*20; if(b.st>.7/sp){ go('charge'); Sound.sfx('howl'); } break;
    case 'charge': b.anim='charge'; b.vx=b.face*300*sp; hurtPlayerRect(b.x-4,b.y+10,b.w+8,b.h-10,3,b.face);
      if(b.hitWall){ shake(9); Sound.sfx('slam'); FX.burst(b.face>0?b.x+b.w:b.x,b.y+30,30,'#a89a8a',160,0,400); b.vx=-b.face*80; b.vy=-120; go('winded'); b.long=1; } break;
    case 'howl_': b.anim='howl'; b.vx=0; if(b.st>.3){ Sound.sfx('howl'); for(let i=0;i<(ph===3?7:5);i++){ const ox=i===0?pcx:rnd(bounds[0]+20,bounds[1]-20); b.orbs.push({x:ox,y:-20,ty:13*TS,t:-.3-i*.18,fall:0}); } go('howling'); } break;
    case 'howling': b.anim='howl'; if(b.st>1.0) go('recover'); break;
    case 'winded': b.anim='winded'; b.vx*=.9; if(b.st>(b.long?1.5:1.0)){ b.long=0; go('recover'); } break;
    case 'recover': b.anim='idle'; b.vx*=.8; if(b.st>.45/sp) go('idle'); break;
  }
  b.hitWall=0; b.vy+=G*1.1*dt; moveBody(b,L,dt,bounds);
  // shockwaves
  b.waves=b.waves.filter(w=>{ w.x+=w.dir*175*dt; w.life-=dt; hurtPlayerRect(w.x-6,w.y-14,12,14,2,w.dir); if(Math.random()<.6) FX.parts.push({x:w.x,y:w.y-2,vx:rnd(-20,20),vy:rnd(-80,-30),life:.4,max:.4,col:'#ffb070',size:2,g:200,glow:1}); return w.life>0&&w.x>bounds[0]&&w.x<bounds[1]; });
  b.orbs=b.orbs.filter(o=>{ o.t+=dt; if(o.t>.9){ o.fall=1; o.y+=520*dt; if(o.y>=o.ty){ Sound.sfx('slam'); shake(3); FX.burst(o.x,o.ty,16,'#d8c8ff',120,1,200); hurtPlayerRect(o.x-14,o.ty-22,28,22,2,Math.sign(pcx-o.x)||1); return false; } } return true; });
}

function hurtPlayerRect(x,y,w,h,dmg,dir){ const P=Player; if(P.inv>0||P.dash>0||P.spin>0||Game.state!=='play') return;
  if(P.x<x+w&&P.x+P.w>x&&P.y<y+h&&P.y+P.h>y) damagePlayer(dmg,dir); }
function damagePlayer(dmg,dir){ const P=Player; P.hp-=dmg; P.inv=1.1; P.hurt=.3; P.vx=dir*150; P.vy=-200; P.atk=null; Sound.sfx('hurt'); shake(5); FX.hitstop=.08; FX.flash=.4;
  FX.burst(P.x+5,P.y+10,10,'#ff6a6a',120); if(P.hp<=0){ P.hp=0; Game.onDeath(); } }

// ================= PLAY =================
const Cam={x:0,y:0,fx:null,fy:null};
const Game={state:'title',L:null,flags:{},aff:0,script:null,wait:null,dlg:null,banner:null,fade:1,fadeTo:0,time:0,arena:null,boss:null,mira:null,actors:[],deaths:0,titleT:0};

function loadLevel(key,opts){ opts=opts||{};
  const L=LEVELDEF[key](); Game.L=L; L.bolts=[]; L.actors=[];
  L.tilesCv=renderTiles(L); const [dc,dx]=mkCanvas(L.w*TS,L.h*TS); L.deco(dx,L); L.decoCv=dc; L.bg=makeBG(L.biome);
  L.npcs=L.ents.filter(e=>e.type==='npc').map(e=>({who:e.who,x:e.x*TS+8,y:e.y*TS,f:e.f,look:e.look,t:Math.random()*4}));
  const d=L.ents.find(e=>e.type==='dummy'); L.dummy=d?{x:d.x*TS+8,y:d.y*TS,flash:0,t:0,hits:0}:null;
  const s=L.ents.find(e=>e.type==='shrine'); L.shrine=s?{x:s.x*TS+8,y:s.y*TS,on:false}:null;
  spawnEnemies(L);
  const sp=opts.spawn||L.spawn; L.check={x:sp[0]*TS+8,y:sp[1]*TS};
  resetPlayer(L.check.x,L.check.y,opts.keepHP);
  const mEnt=L.ents.find(e=>e.type==='mira');
  Game.mira = mEnt? {x:mEnt.x*TS+8,y:mEnt.y*TS,f:-1,anim:'idle',t:0,follow:false,vis:true} : (opts.mira? {x:L.check.x-20,y:L.check.y,f:1,anim:'idle',t:0,follow:true,vis:true} : null);
  Game.trail=[]; Game.arena=null; Game.boss=null; Game.bossBar=null;
  Cam.fx=Cam.fy=null; snapCam();
  if(L.music) Sound.play(L.music);
  Game.banner={name:L.name,sub:L.sub,t:0};
}
function bounds(){ const L=Game.L; return Game.arena&&Game.arena.lock? Game.arena.b : [0,L.w*TS]; }
function snapCam(){ const t=camTarget(); Cam.x=t[0]; Cam.y=t[1]; }
function camTarget(){ const L=Game.L,P=Player,b=bounds();
  let x=Cam.fx!=null?Cam.fx-W/2:P.x+5-W/2+P.face*22, y=Cam.fy!=null?Cam.fy-H*.55:P.y+11-H*.58;
  return [clamp(x,b[0],b[1]-W), clamp(y,0,L.h*TS-H)]; }

// ---------- player ----------
function startAtk(n){ const P=Player; P.atk={t:0,n,hit:new Set(),q:false}; P.combo=n; Sound.sfx('swing');
  FX.arcs.push({f:P.face,n,life:.2,max:.2}); if(P.onGround) P.vx=P.face*(n===2?120:60); }
function updatePlayer(dt){
  const P=Player,L=Game.L, ctl=Game.state==='play'&&!Game.dlg;
  P.t+=dt; P.inv=Math.max(0,P.inv-dt); P.dashCd-=dt; P.comboT-=dt; if(P.drop>0) P.drop-=dt; else P.drop=0;
  let mx=ctl?(held.right?1:0)-(held.left?1:0):0;
  if(P.hurt>0){ P.hurt-=dt; mx=0; }
  if(P.scriptVx!=null){ mx=0; }
  if(ctl&&consume('dash')&&P.dashCd<=0&&(P.onGround||P.airDash)&&P.hurt<=0){ if(mx) P.face=mx; P.dash=.17; P.dashCd=.5; if(!P.onGround) P.airDash=0; P.atk=null; Sound.sfx('dash'); }
  if(P.dash>0){ P.dash-=dt; P.vy=0; P.vx=P.face*285; if(Math.random()<.8) FX.parts.push({x:P.x+5,y:P.y+rnd(4,20),vx:-P.face*30,vy:0,life:.25,max:.25,col:'#8fd3ff',size:2,g:0,glow:1}); }
  else {
    const slow=P.atk&&P.onGround?.3:1, spd=P.gliding?128:112;
    const tgt=P.scriptVx!=null?P.scriptVx:mx*spd*slow, acc=P.onGround?1200:760;
    if(P.hurt<=0) P.vx=P.vx<tgt?Math.min(tgt,P.vx+acc*dt):Math.max(tgt,P.vx-acc*dt);
    if(mx&&!P.atk) P.face=mx; if(P.scriptVx) P.face=Math.sign(P.scriptVx);
    if(ctl&&consume('jump')) P.jbuf=.12; else P.jbuf-=dt;
    if(P.jbuf>0&&P.hurt<=0){
      if(held.down&&P.onGround&&rectHitsTile(L,P.x,P.y+P.h,P.w,2,v=>v===3)){ P.drop=.25; P.jbuf=0; P.onGround=false; }
      else if(P.onGround||P.coyote>0){ P.vy=-305; P.coyote=0; P.jbuf=0; P.onGround=false; Sound.sfx('jump'); FX.burst(P.x+5,P.y+P.h,5,'#d8d0c0',40,0,0); }
      else if(P.jumps>0){ P.vy=-290; P.jumps=0; P.jbuf=0; Sound.sfx('djump'); for(let i=0;i<8;i++) FX.parts.push({x:P.x+5,y:P.y+P.h,vx:rnd(-60,60),vy:rnd(10,60),life:.4,max:.4,col:'#bfe8ff',size:1,g:0,glow:1}); }
    }
    if(!held.jump&&P.vy<-110&&P.scriptVx==null) P.vy+=G*dt*1.3;
    const wasG=P.gliding; P.gliding=ctl&&!P.onGround&&held.jump&&P.jumps===0&&P.vy>=0&&!P.atk&&P.hurt<=0&&P.spin<=0;
    if(P.gliding&&!wasG) Sound.sfx('glide');
    P.vy+=G*dt; if(P.gliding){ P.vy=Math.min(P.vy,46); P.glideSnd-=dt; if(P.glideSnd<=0){P.glideSnd=.5; Sound.sfx('glide');} } P.vy=Math.min(P.vy,430);
  }
  // attacks
  if(ctl&&consume('attack')&&P.hurt<=0&&P.spin<=0){ if(!P.atk) startAtk(P.comboT>0?(P.combo+1)%3:0); else if(P.atk.t>.09) P.atk.q=true; }
  if(P.atk){ P.atk.t+=dt; const a=P.atk; if(a.t>.04&&a.t<.17) attackHits(P.face>0?P.x+P.w-2:P.x-26,P.y-4,28,P.h+6,a.n===2?2:1,a.hit,P.face);
    if(a.t>=.24){ if(a.q) startAtk((a.n+1)%3); else { P.atk=null; P.comboT=.3; } } }
  if(ctl&&consume('special')){ if(P.spirit>=50&&P.spin<=0&&P.hurt<=0){ P.spin=.5; P.spirit-=50; P.atk=null; P.spinHit=new Set(); P.spinTick=0; Sound.sfx('spin'); P.vy=Math.min(P.vy,-120); } }
  if(P.spin>0){ P.spin-=dt; P.spinTick-=dt; if(P.spinTick<=0){ P.spinTick=.12; P.spinHit=new Set(); } attackHits(P.x-30,P.y-18,P.w+60,P.h+30,2,P.spinHit,0);
    for(let i=0;i<3;i++){ const a=rnd(0,7); FX.parts.push({x:P.x+5+Math.cos(a)*30,y:P.y+11+Math.sin(a)*18,vx:-Math.sin(a)*90,vy:Math.cos(a)*50,life:.25,max:.25,col:'#cfe9ff',size:2,g:0,glow:1}); } }
  P.hitWall=0; moveBody(P,L,dt,bounds());
  if(P.onGround){ P.jumps=1; P.airDash=1; P.coyote=.09;
    const tx=Math.floor((P.x+5)/TS), ty=Math.floor((P.y+P.h+2)/TS);

function attackHits(x,y,w,h,dmg,set,dir){
  const L=Game.L,P=Player; let any=false;
  const over=e=>e.x<x+w&&e.x+e.w>x&&e.y<y+h&&e.y+e.h>y;
  for(const m of L.mobs){ if(m.hp<=0||set.has(m)||!over(m)) continue; set.add(m); any=true;
    m.hp-=dmg; m.flash=.15; const kd=dir||Math.sign((m.x+6)-(P.x+5))||1; m.vx=kd*(m.state==='lunge'?160:130); m.vy=-110; m.face=-kd; m.state='stun'; m.st=0;
    spark(m.x+6,m.y+12); if(m.hp<=0) killMob(m); }
  const b=Game.boss; if(b&&b.hp>0&&b.state!=='intro'&&!set.has(b)&&over(b)){ set.add(b); any=true; b.hp=Math.max(0,b.hp-dmg); b.flash=.12; spark(clamp(P.x+5+P.face*14,b.x,b.x+b.w),P.y+8);
    if(b.hp<=0&&Game.onBossDown) Game.onBossDown(); }
  const d=L.dummy; if(d&&!set.has(d)&&x<d.x+6&&x+w>d.x-6&&y<d.y&&y+h>d.y-28){ set.add(d); any=true; d.flash=.25; d.hits++; spark(d.x,d.y-20); }
  for(const bo of L.bolts){ if(!bo.dead&&bo.x>x&&bo.x<x+w&&bo.y>y&&bo.y<y+h){ bo.dead=1; any=true; FX.burst(bo.x,bo.y,8,'#ede4cf',100); Sound.sfx('select'); } }
  if(any){ Sound.sfx('hit'); FX.hitstop=Math.max(FX.hitstop,.05); shake(2); P.spirit=Math.min(100,P.spirit+6); }
}
function spark(x,y){ for(let i=0;i<10;i++){ const a=rnd(0,6.28),s=rnd(60,180); FX.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25,max:.25,col:i%2?'#fff6c8':'#ffd45a',size:i%3?1:2,g:0,glow:1}); } }
function killMob(m){ Sound.sfx('kill'); FX.burst(m.x+6,m.y+12,22,'#6d6a72',150); FX.burst(m.x+6,m.y+12,10,'#ff9a5a',100,1);
  if(Math.random()<.35) Game.L.pick.push({kind:Math.random()<.6?'heart':'spirit',x:m.x+6,y:m.y+10,drop:1}); }

function updateWorld(dt){
  const L=Game.L,P=Player;
  if(Game.state==='play'||Game.state==='cut') updatePlayer(dt);
  const b=bounds();
  for(const m of L.mobs) if(m.hp>0) { if(Game.state==='play') updateMob(m,L,dt,P,b); else { m.vx=0; m.vy+=G*dt; moveBody(m,L,dt,b); m.anim='idle'; m.t+=dt; } }
  L.mobs=L.mobs.filter(m=>m.hp>0);
  if(Game.state==='play') for(const m of L.mobs) if(m.state==='lunge') hurtPlayerRect(m.x,m.y,m.w,m.h,2,m.face);
  for(const bo of L.bolts){ bo.t+=dt; bo.vy+=bo.g*dt; bo.x+=bo.vx*dt; bo.y+=bo.vy*dt; if(isSolid(tileAt(L,Math.floor(bo.x/TS),Math.floor(bo.y/TS)))) { bo.dead=1; FX.burst(bo.x,bo.y,5,'#ede4cf',60); }
    if(!bo.dead&&Game.state==='play'&&P.inv<=0&&P.dash<=0&&P.spin<=0&&bo.x>P.x&&bo.x<P.x+P.w&&bo.y>P.y&&bo.y<P.y+P.h){ bo.dead=1; damagePlayer(1,Math.sign(bo.vx)||1); } if(bo.t>4) bo.dead=1; }
  L.bolts=L.bolts.filter(b=>!b.dead);
  if(Game.boss) { if(Game.state==='play'||Game.boss.state==='intro') updateBoss(Game.boss,L,dt,P,b); else { Game.boss.t+=dt; Game.boss.vy+=G*dt; moveBody(Game.boss,L,dt,b);} }
  for(const n of L.npcs) n.t+=dt;
  if(L.dummy){ L.dummy.t+=dt; L.dummy.flash=Math.max(0,L.dummy.flash-dt); }
  // pickups
  for(const k of L.pick){ if(k.taken) continue; k.t=(k.t||0)+dt; const ky=k.y+Math.sin(k.t*3)*2;
    if(Game.state==='play'&&Math.abs(P.x+5-k.x)<12&&Math.abs(P.y+11-ky)<16){ k.taken=1; if(k.kind==='heart'){ P.hp=Math.min(P.maxHp,P.hp+4); Sound.sfx('heart'); } else { P.spirit=Math.min(100,P.spirit+40); Sound.sfx('secret'); } FX.burst(k.x,ky,14,k.kind==='heart'?'#ff7a8a':'#9fd8ff',90,1,0); } }
  // shrine
  const s=L.shrine; if(s&&Game.state==='play'&&Math.abs(P.x+5-s.x)<18&&Math.abs(P.y+P.h-s.y)<20){ if(!s.on){ s.on=true; L.check={x:s.x,y:s.y}; P.hp=P.maxHp; Sound.sfx('check'); Sound.sfx('bell'); FX.burst(s.x,s.y-20,30,'#bfe8ff',120,1,0); Game.trigger('shrine'); } }
  // Mira
  const mi=Game.mira; if(mi){ mi.t+=dt; if(mi.follow){ const tr=Game.trail, k=tr.length-1-16; if(k>=0){ const p=tr[k];
      const d=Math.hypot(p.x-mi.x,p.y-mi.y); const nx=lerp(mi.x,p.x,Math.min(1,dt*10)), ny=lerp(mi.y,p.y,Math.min(1,dt*10));
      mi.anim=d>.6?p.a:'idle'; if(Math.abs(nx-mi.x)>.05) mi.f=Math.sign(nx-mi.x); mi.x=nx; mi.y=ny; tr.splice(0,Math.max(0,k-1)); if(d<.6) mi.anim='idle'; } else mi.anim='idle'; } }
  // triggers
  for(const tg of L.trig){ if(!tg.done&&Game.state==='play'&&P.x+5>tg.x&&(tg.y==null||P.y+P.h<=tg.y+4)){ tg.done=1; Game.trigger(tg.id,tg); } }
  // arena
  const A=Game.arena; if(A&&A.active&&Game.state==='play'){ if(L.mobs.length===0){ A.gap-=dt; if(A.gap<=0){ if(A.wi<A.waves.length){ spawnWave(A); } else { A.active=false; Game.trigger('arenaClear'); } } } }
  FX.update(dt);
  // camera
  const t=camTarget(), k=1-Math.exp(-dt*(Cam.fx!=null?3:7)); Cam.x=lerp(Cam.x,t[0],k); Cam.y=lerp(Cam.y,t[1],k);
}
function spawnWave(A){ const w=A.waves[A.wi++]; A.gap=1.2; Game.banner={name:'Wave '+A.wi+' of '+A.waves.length,sub:'',t:0,small:1};
  w.forEach((type,i)=>{ const left=i%2===0; const x=left?A.b[0]+20+i*6:A.b[1]-20-i*6; const m=makeMob(type,x,A.groundY-40); m.state='chase'; m.vy=-200; m.cd=rnd(.6,1.6)+i*.3; Game.L.mobs.push(m);

function nearestTalk(){ const P=Player,L=Game.L; let best=null,bd=30;
  for(const n of L.npcs){ const d=Math.abs(n.x-(P.x+5)); if(d<bd&&Math.abs(n.y-(P.y+P.h))<80){bd=d;best={kind:'npc',n};} }
  const mi=Game.mira; if(mi&&mi.vis&&!Game.flags.metMira&&Math.abs(mi.x-(P.x+5))<52) best={kind:'mira',n:mi};

const say=(who,text,ex)=>({type:'say',who,text,ex:ex||'normal'});
const choose=(opts)=>({type:'choice',opts});
const wait=t=>({type:'wait',t});
const fadeOut=()=>{Game.fadeTo=1;return {type:'fade'};}, fadeIn=()=>{Game.fadeTo=0;return {type:'fade'};};
const walkP=(x,sp)=>({type:'walkP',x,sp:sp||70});
const tween=(o,props,dur,ez)=>({type:'tween',o,props,dur,ez,from:null,t:0});

function run(gen,keepPlay){ Game.script=gen(); Game.sv=undefined; if(!keepPlay) Game.state='cut'; Player.scriptVx=null; step(); }
function step(){
  while(Game.script){ const r=Game.script.next(Game.sv); Game.sv=undefined;
    if(r.done){ Game.script=null; Game.wait=null; Player.scriptVx=null; if(Game.state==='cut') Game.state='play'; clearHits(); return; }
    const c=r.value; if(!c) continue;
    if(c.type==='say'||c.type==='choice'){ Game.dlg={...c,shown:0,sel:0,t:0}; Game.wait=c; return; }
    Game.wait=c; return; } }
function updateScript(dt){
  const w=Game.wait; if(!w||Game.dlg) return;
  let done=false;
  if(w.type==='wait'){ w.t-=dt; done=w.t<=0; }
  else if(w.type==='fade'){ done=Math.abs(Game.fade-Game.fadeTo)<.01; }
  else if(w.type==='walkP'){ const P=Player, dx=w.x-(P.x+5); w.tt=(w.tt||0)+dt; if(Math.abs(dx)<3||w.tt>4){ P.scriptVx=0; P.vx=0; done=true; } else P.scriptVx=Math.sign(dx)*w.sp; }
  else if(w.type==='tween'){ if(!w.from){ w.from={}; for(const k in w.props) w.from[k]=w.o[k]; } w.t+=dt; const e=(w.ez||ease)(Math.min(1,w.t/w.dur));
    for(const k in w.props) w.o[k]=lerp(w.from[k],w.props[k],e); done=w.t>=w.dur; }
  if(done){ Game.wait=null; step(); }
}
function updateDialog(dt){
  const d=Game.dlg; if(!d) return; d.t+=dt;
  if(d.type==='say'){ const before=Math.floor(d.shown); d.shown=Math.min(d.text.length,d.shown+dt*48); if(Math.floor(d.shown)>before&&Math.floor(d.shown)%3===0&&d.text[Math.floor(d.shown)]!==' ') Sound.sfx('blip');
    if(d.t>.15&&(consume('confirm')||consume('attack')||consume('jump'))){ if(d.shown<d.text.length) d.shown=d.text.length; else { Game.dlg=null; Game.wait=null; step(); } } }
  else { if(consume('up')) { d.sel=(d.sel+d.opts.length-1)%d.opts.length; Sound.sfx('blip'); } if(consume('down')) { d.sel=(d.sel+1)%d.opts.length; Sound.sfx('blip'); }
    if(d.t>.3&&(consume('confirm')||consume('attack')||consume('jump'))){ const o=d.opts[d.sel]; Sound.sfx('select'); if(o.aff){ Game.aff+=o.aff; Game.heartPop={n:o.aff,t:0}; setTimeout(()=>Sound.sfx('aff'),120); }
      Game.dlg=null; Game.wait=null; Game.sv=d.sel; step(); } }
}

function compose(cx,cy){

  D.globalCompositeOperation='soft-light'; D.fillStyle=B.grade; D.fillRect(0,0,W*S,H*S);

  // god rays

  if(L.biome==='ruins'){ const g=D.createLinearGradient(0,0,0,H*S); g.addColorStop(0,'rgba(170,200,255,.09)'); g.addColorStop(1,'rgba(170,200,255,0)'); D.fillStyle=g;
    const x0=(900-cx*.6*S/3)%(W*S+400); D.beginPath(); D.moveTo(x0,0); D.lineTo(x0+120,0); D.lineTo(x0-80,H*S); D.lineTo(x0-260,H*S); D.fill(); }

const FD="'Cinzel Decorative', Georgia, serif", FB="'Alegreya Sans', 'Trebuchet MS', sans-serif";
function heartPath(x,y,s){ D.beginPath(); D.moveTo(x,y+s*.3); D.bezierCurveTo(x,y-s*.1,x-s*.55,y-s*.1,x-s*.55,y+s*.25); D.bezierCurveTo(x-s*.55,y+s*.55,x-s*.15,y+s*.7,x,y+s*.95);
  D.bezierCurveTo(x+s*.15,y+s*.7,x+s*.55,y+s*.55,x+s*.55,y+s*.25); D.bezierCurveTo(x+s*.55,y-s*.1,x,y-s*.1,x,y+s*.3); D.closePath(); }
function frame(x,y,w,h,a){ D.fillStyle=`rgba(12,13,30,${a||.88})`; D.fillRect(x,y,w,h); D.strokeStyle='rgba(216,180,106,.9)'; D.lineWidth=2; D.strokeRect(x+5,y+5,w-10,h-10); D.strokeStyle='rgba(216,180,106,.35)'; D.lineWidth=1; D.strokeRect(x+10,y+10,w-20,h-20);
  D.fillStyle='#d8b46a'; for(const [cx,cy] of [[x+5,y+5],[x+w-5,y+5],[x+5,y+h-5],[x+w-5,y+h-5]]){ D.save(); D.translate(cx,cy); D.rotate(Math.PI/4); D.fillRect(-5,-5,10,10); D.restore(); } }
function wrap(text,maxW){ const words=text.split(' '),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(D.measureText(tst).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; }
function drawHUD(){
  const P=Player, t=performance.now()/1000;
  for(let i=0;i<P.maxHp/2;i++){ const x=40+i*40, y=22, v=P.hp-i*2; heartPath(x,y,30); D.fillStyle='rgba(20,10,20,.75)'; D.fill(); D.lineWidth=3; D.strokeStyle='#1a0e14'; D.stroke();
    if(v>0){ D.save(); heartPath(x,y,30); D.clip(); D.fillStyle='#e8434f'; D.fillRect(x-20,y-10,v>=2?40:20,40); D.fillStyle='rgba(255,255,255,.35)'; D.beginPath(); D.arc(x-8,y+6,4,0,7); D.fill(); D.restore(); }
    heartPath(x,y,30); D.lineWidth=1.5; D.strokeStyle='rgba(255,220,200,.55)'; D.stroke(); }
  // moon gauge
  const gx=22,gy=62,gw=200; D.fillStyle='rgba(10,12,28,.75)'; D.fillRect(gx+28,gy+6,gw,12); const fillW=gw*P.spirit/100;
  const gg=D.createLinearGradient(gx+28,0,gx+28+gw,0); gg.addColorStop(0,'#5a8ad8'); gg.addColorStop(1,'#cfe9ff'); D.fillStyle=gg; D.fillRect(gx+28,gy+6,fillW,12);
  D.fillStyle='rgba(255,255,255,.6)'; D.fillRect(gx+28+gw/2,gy+4,2,16); D.strokeStyle='#d8b46a'; D.lineWidth=1.5; D.strokeRect(gx+28,gy+6,gw,12);
  D.fillStyle=P.spirit>=50?`rgba(220,240,255,${.7+.3*Math.sin(t*6)})`:'#9aa4c0'; D.beginPath(); D.arc(gx+12,gy+12,11,0,7); D.fill(); D.fillStyle='#0c0d1e'; D.beginPath(); D.arc(gx+17,gy+9,9,0,7); D.fill();
  if(P.spirit>=50){ D.font=`700 15px ${FB}`; D.fillStyle='#cfe9ff'; D.fillText('SPIN READY · L',gx+gw+38,gy+18); }
  // boss bar
  const b=Game.boss; if(b&&Game.bossBar){ const bw=640,bx=(W*S-bw)/2,by=H*S-56; D.font=`700 22px ${FD}`; D.fillStyle='#f0d9a8'; D.textAlign='center'; D.fillText('Grimmaw, Lord of Hounds',W*S/2,by-10); D.textAlign='left';
    D.fillStyle='rgba(10,6,12,.8)'; D.fillRect(bx,by,bw,16); D.fillStyle='#7a1a28'; D.fillRect(bx,by,bw*b.hp/b.maxHp,16); D.fillStyle='#d8434f'; D.fillRect(bx,by,bw*b.hp/b.maxHp,6); D.strokeStyle='#d8b46a'; D.lineWidth=2; D.strokeRect(bx,by,bw,16);
    [.6,.3].forEach(f=>{ D.fillStyle='#d8b46a'; D.fillRect(bx+bw*f-1,by-3,2,22); }); }
  // affection pop
  const hp=Game.heartPop; if(hp){ hp.t+=1/60; const a=Math.max(0,1-hp.t/1.8); D.globalAlpha=a; D.font=`700 26px ${FB}`; D.fillStyle='#ff9ab0'; D.textAlign='right'; D.fillText('Mira '+'♥'.repeat(hp.n),W*S-34,52-hp.t*14); D.textAlign='left'; D.globalAlpha=1; if(a<=0) Game.heartPop=null; }
  if(Game.hintT>0){ Game.hintT-=1/60; D.globalAlpha=Math.min(1,Game.hintT); frame(W*S-500,90,470,128,.75); D.font=`500 18px ${FB}`; D.fillStyle='#e9e2cf';
    ['A / D  move     Space  jump, again to double jump','Hold Space after the double jump to glide','J  attack     K  dash     L  spirit spin','E  talk to people'].forEach((s,i)=>D.fillText(s,W*S-478,124+i*25)); D.globalAlpha=1; }
}
function drawBanner(){ const bn=Game.banner; if(!bn) return; bn.t+=1/60; const life=bn.small?1.6:3.4; const a=bn.t<.6?bn.t/.6:bn.t>life-.8?Math.max(0,(life-bn.t)/.8):1; if(bn.t>life){Game.banner=null;return;}
  D.globalAlpha=a; D.textAlign='center'; D.shadowColor='rgba(0,0,0,.7)'; D.shadowBlur=12;
  D.font=`900 ${bn.small?34:52}px ${FD}`; D.fillStyle='#f3dfae'; D.fillText(bn.name,W*S/2,bn.small?150:170);
  if(bn.sub){ D.font=`italic 500 24px ${FB}`; D.fillStyle='#e9e2cf'; D.fillText(bn.sub,W*S/2,208); const w=D.measureText(bn.sub).width; D.fillStyle='#d8b46a'; D.fillRect(W*S/2-w/2-60,198,40,1.5); D.fillRect(W*S/2+w/2+20,198,40,1.5); }
  D.shadowBlur=0; D.textAlign='left'; D.globalAlpha=1; }
function drawDialog(){ const d=Game.dlg; if(!d) return; const t=performance.now()/1000;
  const bx=60,by=H*S-210,bw=W*S-120,bh=184; frame(bx,by,bw,bh);
  const who=d.type==='choice'?'shayan':d.who, narr=d.type==='say'&&!d.who;
  let tx=bx+36;
  if(!narr){ const pc=portrait(who,d.type==='choice'?'normal':d.ex); D.save(); D.fillStyle='rgba(40,36,70,.9)'; D.fillRect(bx+26,by+16,152,152); D.imageSmoothingEnabled=false; D.drawImage(pc,0,0,56,56,bx+26-2,by+16-6,160,160); D.restore();
    D.strokeStyle='rgba(216,180,106,.8)'; D.lineWidth=2; D.strokeRect(bx+26,by+16,152,152); tx=bx+204;
    D.font=`700 22px ${FD}`; const nm=NAMES[who]; const nw=D.measureText(nm).width+40; frame(bx+190,by-26,nw,40,.95); D.fillStyle='#f3dfae'; D.fillText(nm,bx+210,by+2); }
  const maxW=bx+bw-tx-36;
  if(d.type==='say'){ D.font=`${narr?'italic ':''}500 27px ${FB}`; D.fillStyle=narr?'#d9d2ff':'#efe8d6'; const lines=wrap(d.text,maxW); let left=Math.floor(d.shown);
    lines.forEach((ln,i)=>{ if(left<=0) return; const s=ln.slice(0,left); left-=ln.length+1; D.fillText(s,tx,by+56+i*36); });
    if(d.shown>=d.text.length){ D.fillStyle='#d8b46a'; const yy=by+bh-26+Math.sin(t*6)*3; D.beginPath(); D.moveTo(bx+bw-44,yy); D.lineTo(bx+bw-30,yy); D.lineTo(bx+bw-37,yy+8); D.fill(); } }
  else { D.font=`italic 500 18px ${FB}`; D.fillStyle='#b8a888'; D.fillText('Choose your words  (W / S, then E)',tx,by+40);
    d.opts.forEach((o,i)=>{ const y=by+76+i*36, sel=i===d.sel; if(sel){ D.fillStyle='rgba(216,180,106,.16)'; D.fillRect(tx-14,y-26,maxW+20,34); D.fillStyle='#d8b46a'; D.beginPath(); D.moveTo(tx-6,y-16); D.lineTo(tx+4,y-9); D.lineTo(tx-6,y-2); D.fill(); }
      D.font=`${sel?700:500} 24px ${FB}`; D.fillStyle=sel?'#fff4d6':'#cfc6b0'; D.fillText(wrap(o.t,maxW-30)[0],tx+16,y); }); } }
function drawTalkPrompt(cx,cy){ if(Game.state!=='play'||Game.dlg) return; const n=nearestTalk(); if(!n) return; const t=performance.now()/1000;
  const x=(n.n.x-cx)*S, y=(n.n.y-cy-34)*S+Math.sin(t*4)*4; D.fillStyle='rgba(12,13,30,.85)'; D.beginPath(); D.arc(x,y,17,0,7); D.fill(); D.strokeStyle='#d8b46a'; D.lineWidth=2; D.stroke();
  D.font=`700 18px ${FB}`; D.fillStyle='#f3dfae'; D.textAlign='center'; D.fillText('E',x,y+6); D.textAlign='left'; }

function drawCenterText(lines){ D.textAlign='center'; lines.forEach(([txt,font,col,y])=>{ D.font=font; D.fillStyle=col; D.fillText(txt,W*S/2,y); }); D.textAlign='left'; }
function drawTitle(){ const t=performance.now()/1000; D.fillStyle='rgba(6,6,18,.35)'; D.fillRect(0,0,W*S,H*S);
  D.shadowColor='rgba(0,0,0,.8)'; D.shadowBlur=18;
  drawCenterText([['A Shayan Saqib Tale',`italic 500 26px ${FB}`,'#e9d6b0',190],["The Moonsinger's Bell",`900 72px ${FD}`,'#f6dfa6',270]]);
  D.shadowBlur=0; D.fillStyle='#d8b46a'; D.fillRect(W*S/2-200,300,400,1.5);
  D.globalAlpha=.6+.4*Math.sin(t*3); drawCenterText([['Press E or Enter to begin',`700 26px ${FB}`,'#fff4d6',370]]); D.globalAlpha=1;
  drawCenterText([['About 20 minutes  ·  Your words with Mira shape the ending  ·  Sound on',`500 19px ${FB}`,'#cfc6b0',H*S-40]]); }
function drawPause(){ D.fillStyle='rgba(6,6,18,.7)'; D.fillRect(0,0,W*S,H*S); frame(W*S/2-300,110,600,440,.92);
  drawCenterText([['Paused',`900 44px ${FD}`,'#f3dfae',180]]);
  const rows=[['Move','A / D  or  ← →'],['Jump','Space, W or Z  (press again in the air)'],['Glide','Hold jump after the double jump'],['Attack','J or X  (three-hit combo)'],['Dash','K, C or Shift'],['Spirit spin','L or V  (half a moon gauge)'],['Talk / advance','E or Enter'],['Drop through a ledge','S + Space'],['Mute','M']];
  rows.forEach(([a,b],i)=>{ D.font=`700 21px ${FB}`; D.fillStyle='#d8b46a'; D.textAlign='right'; D.fillText(a,W*S/2-20,236+i*32); D.textAlign='left'; D.font=`500 21px ${FB}`; D.fillStyle='#efe8d6'; D.fillText(b,W*S/2+10,236+i*32); });
  drawCenterText([['Esc to resume',`italic 500 20px ${FB}`,'#b8a888',528]]); }
function drawDead(){ const a=Math.min(1,Game.deadT/1.2); D.fillStyle=`rgba(30,4,10,${.7*a})`; D.fillRect(0,0,W*S,H*S); D.globalAlpha=a;
  drawCenterText([['You have fallen',`900 54px ${FD}`,'#f0b0a0',290],['The bell in your pocket is still ringing.',`italic 500 24px ${FB}`,'#e9d6c8',340]]);
  if(Game.deadT>1.2) { D.globalAlpha=.6+.4*Math.sin(performance.now()/300); drawCenterText([['Press E to rise again',`700 24px ${FB}`,'#fff4d6',410]]); } D.globalAlpha=1; }
function drawEnd(){ Game.endT+=1/60; const a=Math.min(1,Game.endT/2); D.fillStyle='#05050c'; D.fillRect(0,0,W*S,H*S);
  for(const [x,y,b] of STARS){ D.fillStyle=`rgba(230,235,255,${(.3+.6*b)*a})`; D.fillRect(x*S,y*S,2,2); }
  D.fillStyle=`rgba(232,238,252,${a})`; D.beginPath(); D.arc(W*S/2,150,46,0,7); D.fill();
  const names=['Tied Paths','A Promise at the Festival','Moonlit Friends']; const e=Game.ending||0;
  D.globalAlpha=a; const mins=Math.floor(Game.time/60), secs=Math.floor(Game.time%60);
  drawCenterText([[`Ending ${e+1} of 3`,`italic 500 22px ${FB}`,'#b8a888',260],[names[e],`900 50px ${FD}`,'#f6dfa6',318],
    [`Mira's heart  ${'♥'.repeat(Math.min(Game.aff,13))}  (${Game.aff} of 13)`,`700 22px ${FB}`,'#ff9ab0',380],
    [`Time  ${mins}:${String(secs).padStart(2,'0')}    ·    Falls  ${Game.deaths}`,`500 20px ${FB}`,'#cfc6b0',414],
    ['Thank you for playing The Moonsinger\'s Bell.',`italic 500 22px ${FB}`,'#e9e2cf',480]]);
  if(Game.endT>3){ D.globalAlpha=.6+.4*Math.sin(performance.now()/300); drawCenterText([['Press E to return to the title',`700 22px ${FB}`,'#fff4d6',560]]); } D.globalAlpha=1; }

// ---------- loop ----------
function toTitle(){ Game.state='title'; Game.script=null; Game.dlg=null; Game.wait=null; Game.eclipse=0; Game.darken=0; Game.petals=0; loadLevel('village'); Game.banner=null; Game.fade=1; Game.fadeTo=0; Sound.play('village'); Game.titleT=0; }
let last=performance.now(), fpsAcc=0, fpsN=0; Game.hq=canFilter;
function frameLoop(now){
  let dt=Math.min(1/30,(now-last)/1000); last=now;
  fpsAcc+=dt; fpsN++; if(fpsN===90){ if(fpsAcc/90>1/38&&Game.hq) Game.hq=false; fpsAcc=0; fpsN=0; }
  if(consume('mute')) Sound.toggleMute();
  const st=Game.state;
  if(st==='title'){ Game.titleT+=dt; Cam.fx=200+((Game.titleT*18)%1100); Cam.fy=150; if(consume('confirm')||consume('attack')||consume('jump')){ Cam.fx=Cam.fy=null; Sound.unlock(); Sound.sfx('select'); Game.state='cut'; newGame(); } }
  else if(st==='paused'){ if(consume('pause')||consume('confirm')) Game.state=Game.prev; }
  else if(st==='dead'){ Game.deadT+=dt; if(Game.deadT>1.2&&(consume('confirm')||consume('attack'))) respawn(); }
  else if(st==='end'){ if(Game.endT>3&&(consume('confirm')||consume('attack'))) toTitle(); }
  else { if(consume('pause')&&!Game.dlg){ Game.prev=st; Game.state='paused'; }
    if(st==='play'&&consume('confirm')){ const n=nearestTalk(); if(n){ if(n.kind==='mira') run(SCR.meetMira); else run({elder:Game.flags.introDone?SCR.elderAgain:SCR.elderAgain,baker:SCR.baker,kid:SCR.kid}[n.n.who]); } } }
  Game.fade=lerp(Game.fade,Game.fadeTo,Math.min(1,dt*3)); if(Math.abs(Game.fade-Game.fadeTo)<.01) Game.fade=Game.fadeTo;
  if(Game.state!=='paused'&&Game.state!=='end'){
    if(Game.state==='play'||Game.state==='cut') Game.time+=dt;
    updateDialog(dt); updateScript(dt);
    if(FX.hitstop>0) FX.hitstop-=dt; else updateWorld(dt);
  }
  if(Game.state==='end'){ drawEnd(); }
  else { const sx=FX.shake?rnd(-FX.shake,FX.shake):0, sy=FX.shake?rnd(-FX.shake,FX.shake):0; const cx=Math.round(Cam.x+sx), cy=Math.round(Cam.y+sy);
    drawWorld(cx,cy); compose(cx,cy);
    if(Game.state==='title') drawTitle();
    else { if(Game.fade<.98){ drawTalkPrompt(cx,cy); drawHUD(); } }
    if(Game.fade>0){ D.fillStyle=`rgba(4,4,10,${Game.fade})`; D.fillRect(0,0,W*S,H*S); }
    if(Game.state!=='title'){ drawBanner(); drawDialog(); }
    if(Game.state==='paused') drawPause(); if(Game.state==='dead') drawDead(); }
  clearHits(); requestAnimationFrame(frameLoop);
}
function fit(){ const wrapEl=document.getElementById('wrap'), hint=document.getElementById('hint');
  const aw=document.body.clientWidth-Math.max(32,0), ah=document.body.clientHeight-(getComputedStyle(hint).display==='none'?16:hint.offsetHeight+24);
  let w=Math.min(aw,ah*16/9); w=Math.max(200,w); wrapEl.style.width=Math.floor(w)+'px'; wrapEl.style.height=Math.floor(w*9/16)+'px'; }
addEventListener('resize',fit); fit();
disp.addEventListener('pointerdown',()=>{ disp.focus(); Sound.unlock(); if(Game.state==='title'||Game.state==='end'||Game.state==='dead'||Game.dlg) press('confirm'); setTimeout(()=>release('confirm'),50); });
toTitle(); disp.focus(); requestAnimationFrame(frameLoop);
</script>
